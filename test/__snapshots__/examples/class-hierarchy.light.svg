<g class="description">
<text x="32" y="73.73" font-family="Structa Inter, Inter, sans-serif" font-size="13" font-weight="400" fill="#59636e">Every sensor can be read, and most can be calibrated. The light meter is new, and the vent switch only</text>
<text x="32" y="91.73" font-family="Structa Inter, Inter, sans-serif" font-size="13" font-weight="400" fill="#59636e">reports open or shut, so it skips calibration.</text>
</g>
