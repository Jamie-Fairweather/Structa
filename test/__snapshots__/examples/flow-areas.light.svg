<g class="description">
<text x="32" y="73.73" font-family="Structa Inter, Inter, sans-serif" font-size="13" font-weight="400" fill="#59636e">Who does each step: the pupil at home, then the staff at the front desk and the teacher in the lesson</text>
<text x="32" y="91.73" font-family="Structa Inter, Inter, sans-serif" font-size="13" font-weight="400" fill="#59636e">room.</text>
