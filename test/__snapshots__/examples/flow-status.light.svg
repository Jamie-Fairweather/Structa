<text x="32" y="73.73" font-family="Structa Inter, Inter, sans-serif" font-size="13" font-weight="400" fill="#59636e">Orders now close on Thursday night and every loaf is weighed before it is boxed. Phone orders are</text>
<text x="32" y="91.73" font-family="Structa Inter, Inter, sans-serif" font-size="13" font-weight="400" fill="#59636e">gone.</text>
</g>
