<path class="outline" d="M343 960 L428.5 1002.5 L343 1045 L257.5 1002.5 Z" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#structa-shadow-dark)" stroke-linejoin="round"/>
<text x="343" y="1007.59" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Fixable today?</text>
