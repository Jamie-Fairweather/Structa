<text x="536.17" y="541.09" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Wait for a free fixer</text>
</g>
<g class="card" data-id="safe" data-kind="decision" data-area="bench">
<title>Safe to open?</title>
<path class="outline" d="M536.17 670 L619.17 711 L536.17 752 L453.17 711 Z" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#structa-shadow-dark)" stroke-linejoin="round"/>
<text x="536.17" y="716.09" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Safe to open?</text>
</g>
