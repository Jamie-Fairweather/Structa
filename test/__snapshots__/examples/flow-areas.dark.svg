<svg xmlns="http://www.w3.org/2000/svg" width="704" height="1409" viewBox="0 0 704 1409">
<defs>
<pattern id="structa-grid-dark" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1" fill="#6e7681" fill-opacity="0.4"/></pattern>
<filter id="structa-shadow-dark" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#010409" flood-opacity="0.5"/></filter>
</defs>
<rect width="704" height="1409" fill="#0d1117"/>
<rect width="704" height="1409" fill="url(#structa-grid-dark)"/>
<g class="title">
<text x="32" y="50.55" font-family="Structa Inter, Inter, sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Repair café: fixing a broken toaster</text>
</g>
<g class="description">
<text x="32" y="73.73" font-family="Structa Inter, Inter, sans-serif" font-size="13" font-weight="400" fill="#8b949e">Who does each step: the visitor at home, then the volunteers at the welcome desk and the repair bench.</text>
</g>
<g class="area" data-id="visitor">
<title>Visitor</title>
<rect class="area-box" x="425.67" y="102" width="221" height="184" rx="12" fill="#8b949e" fill-opacity="0.07" stroke="#30363d" stroke-width="1"/>
</g>
<g class="area" data-id="cafe">
<title>Repair café</title>
<rect class="area-box" x="32" y="350" width="640" height="987" rx="12" fill="#8b949e" fill-opacity="0.07" stroke="#30363d" stroke-width="1"/>
</g>
<g class="area" data-id="desk" data-parent="cafe">
<title>Welcome desk</title>
<rect class="area-box" x="435.17" y="390" width="202" height="184" rx="12" fill="#8b949e" fill-opacity="0.07" stroke="#30363d" stroke-width="1"/>
</g>
<g class="area" data-id="bench" data-parent="cafe">
<title>Repair bench</title>
<rect class="area-box" x="48" y="638" width="608" height="583" rx="12" fill="#8b949e" fill-opacity="0.07" stroke="#30363d" stroke-width="1"/>
</g>
<g class="card" data-id="broken" data-kind="start" data-area="visitor">
<title>Toaster won't heat up</title>
<rect class="outline" x="441.67" y="134" width="189" height="44" rx="22" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#structa-shadow-dark)"/>
<text x="536.17" y="161.09" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Toaster won't heat up</text>
</g>
<g class="card" data-id="book" data-kind="io" data-area="visitor">
<title>Book a repair slot</title>
<path class="outline" d="M468.17 226 L618.17 226 L604.17 270 L454.17 270 Z" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#structa-shadow-dark)" stroke-linejoin="round"/>
<text x="536.17" y="253.09" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Book a repair slot</text>
</g>
<g class="card" data-id="sign" data-kind="step" data-area="desk">
<title>Sign the safety form</title>
<rect class="outline" x="451.17" y="422" width="170" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#structa-shadow-dark)"/>
<text x="536.17" y="449.09" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Sign the safety form</text>
</g>
<g class="card" data-id="queue" data-kind="step" data-area="desk">
<title>Wait for a free fixer</title>
