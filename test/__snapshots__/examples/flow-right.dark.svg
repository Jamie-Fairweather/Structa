<svg xmlns="http://www.w3.org/2000/svg" width="1324" height="135" viewBox="0 0 1324 135">
<defs>
<pattern id="structa-grid-dark" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1" fill="#6e7681" fill-opacity="0.4"/></pattern>
<filter id="structa-shadow-dark" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#010409" flood-opacity="0.5"/></filter>
</defs>
<rect width="1324" height="135" fill="#0d1117"/>
<rect width="1324" height="135" fill="url(#structa-grid-dark)"/>
<g class="card" data-id="choose" data-kind="step">
<title>Choose the paintings</title>
<rect class="outline" x="32" y="42" width="176" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#structa-shadow-dark)"/>
<text x="120" y="69.09" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Choose the paintings</text>
</g>
<g class="card" data-id="check" data-kind="step">
<title>Check each frame</title>
<rect class="outline" x="256" y="42" width="156" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#structa-shadow-dark)"/>
<text x="334" y="69.09" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Check each frame</text>
</g>
<g class="card" data-id="order" data-kind="step">
<title>Order new glass</title>
<rect class="outline" x="460" y="34.67" width="143" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#structa-shadow-dark)"/>
<text x="531.5" y="61.76" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Order new glass</text>
</g>
<g class="card" data-id="hang" data-kind="step">
<title>Hang them in the gallery</title>
<rect class="outline" x="651" y="42" width="197" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#structa-shadow-dark)"/>
<text x="749.5" y="69.09" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Hang them in the gallery</text>
</g>
<g class="card" data-id="light" data-kind="step">
<title>Light them with the curator watching</title>
<rect class="outline" x="896" y="32" width="215" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#structa-shadow-dark)"/>
<text x="1003.5" y="59.09" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Light them with the curator</text>
<text x="1003.5" y="79.09" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">watching</text>
</g>
<g class="card" data-id="open" data-kind="step">
<title>Open the room</title>
<rect class="outline" x="1159" y="42" width="133" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#structa-shadow-dark)"/>
<text x="1225.5" y="69.09" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Open the room</text>
</g>
<g class="line" data-id="edges[0]" data-kind="flow" data-from="choose" data-to="check">
<title>Choose the paintings → Check each frame</title>
<path d="M208 64 L247 64" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M256 64 L247 68.5 L247 59.5 Z" fill="#6e7681"/>
</g>
<g class="line" data-id="edges[1]" data-kind="flow" data-from="check" data-to="order">
<title>Check each frame → Order new glass</title>
<path d="M412 56.67 L451 56.67" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M460 56.67 L451 61.17 L451 52.17 Z" fill="#6e7681"/>
</g>
<g class="line" data-id="edges[2]" data-kind="flow" data-from="check" data-to="hang">
<title>Check each frame → Hang them in the gallery</title>
<path d="M412 71.33 L428 71.33 Q436 71.33 436 79.33 L436 94.67 Q436 102.67 444 102.67 L619 102.67 Q627 102.67 627 94.67 L627 79.33 Q627 71.33 635 71.33 L642 71.33" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M651 71.33 L642 75.83 L642 66.83 Z" fill="#6e7681"/>
</g>
<g class="line" data-id="edges[3]" data-kind="flow" data-from="order" data-to="hang">
<title>Order new glass → Hang them in the gallery</title>
<path d="M603 56.67 L642 56.67" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M651 56.67 L642 61.17 L642 52.17 Z" fill="#6e7681"/>
</g>
<g class="line" data-id="edges[4]" data-kind="flow" data-from="hang" data-to="light">
<title>Hang them in the gallery → Light them with the curator watching</title>
<path d="M848 64 L887 64" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M896 64 L887 68.5 L887 59.5 Z" fill="#6e7681"/>
</g>
<g class="line" data-id="edges[5]" data-kind="flow" data-from="light" data-to="open">
<title>Light them with the curator watching → Open the room</title>
<path d="M1111 64 L1150 64" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M1159 64 L1150 68.5 L1150 59.5 Z" fill="#6e7681"/>
</g>
</svg>
