<svg xmlns="http://www.w3.org/2000/svg" width="424" height="408" viewBox="0 0 424 408">
<defs>
<pattern id="structa-grid-light" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1" fill="#8c959f" fill-opacity="0.5"/></pattern>
<filter id="structa-shadow-light" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.1"/></filter>
</defs>
<rect width="424" height="408" fill="#f4f5f7"/>
<rect width="424" height="408" fill="url(#structa-grid-light)"/>
<g class="card" data-id="member" data-kind="class">
<title>Member</title>
<rect x="32" y="32" width="360" height="44" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1" filter="url(#structa-shadow-light)"/>
<text x="212" y="59.46" font-family="Structa Inter, Inter, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Member</text>
</g>
<g class="card" data-id="loan" data-kind="class">
<title>Loan</title>
<rect x="32" y="224" width="360" height="44" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1" filter="url(#structa-shadow-light)"/>
<text x="212" y="251.46" font-family="Structa Inter, Inter, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Loan</text>
</g>
<g class="card" data-id="packet" data-kind="class">
<title>SeedPacket</title>
<rect x="32" y="332" width="360" height="44" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1" filter="url(#structa-shadow-light)"/>
<text x="212" y="359.46" font-family="Structa Inter, Inter, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">SeedPacket</text>
</g>
<g class="line" data-id="edges[0]" data-kind="association" data-from="member" data-to="loan">
<title>Member – Loan: borrows</title>
<path d="M212 76 L212 224" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linejoin="round"/>
</g>
<g class="line" data-id="edges[1]" data-kind="association" data-from="loan" data-to="packet">
<title>Loan – SeedPacket</title>
<path d="M212 268 L212 332" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linejoin="round"/>
</g>
<g class="line-labels">
<g class="line-label" data-line="edges[0]">
<title>Member – Loan: borrows</title>
<rect x="180.5" y="140" width="63" height="20" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1"/>
<text x="212" y="154.37" font-family="Structa Inter, Inter, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">borrows</text>
</g>
</g>
</svg>
