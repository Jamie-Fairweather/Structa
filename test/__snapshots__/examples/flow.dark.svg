<path d="M170.5 710.67 L170.5 684 Q170.5 676 178.5 676 L403 676 Q411 676 411 668 L411 292 Q411 284 403 284 L192.67 284 Q184.67 284 184.67 276 L184.67 269" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M184.67 260 L189.17 269 L180.17 269 Z" fill="#6e7681"/>
</g>
<g class="line" data-id="edges[10]" data-kind="flow" data-from="log" data-to="play">
