<text x="305.5" y="462.37" font-family="Structa Inter, Inter, sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">no</text>
</g>
<g class="line-label" data-line="edges[8]">
<title>In tune? → Note it in the practice log: yes</title>
<rect x="131" y="812" width="37" height="20" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1"/>
<text x="149.5" y="826.37" font-family="Structa Inter, Inter, sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">yes</text>
</g>
<g class="line-label" data-line="edges[9]">
<title>In tune? → Pluck the string: no</title>
<rect x="395.5" y="448" width="31" height="20" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="1"/>
<text x="411" y="462.37" font-family="Structa Inter, Inter, sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">no</text>
</g>
</g>
</svg>
