<path d="M305.5 560 L305.5 576 Q305.5 584 297.5 584 L157 584 Q149 584 149 592 L149 599" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M149 608 L144.5 599 L153.5 599 Z" fill="#6e7681"/>
