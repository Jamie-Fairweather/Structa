<path class="outline" d="M55.5 880 L257.5 880 L243.5 924 L41.5 924 Z" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#structa-shadow-dark)" stroke-linejoin="round"/>
<text x="149.5" y="907.09" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Note it in the practice log</text>
