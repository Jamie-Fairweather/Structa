<path class="outline" d="M149.5 700 L212.5 732 L149.5 764 L86.5 732 Z" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#structa-shadow-dark)" stroke-linejoin="round"/>
<text x="149.5" y="737.09" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">In tune?</text>
</g>
<g class="card" data-id="log" data-kind="io">
