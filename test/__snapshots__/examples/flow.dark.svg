<text x="108" y="462.37" font-family="Structa Inter, Inter, sans-serif" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="middle">yes</text>
</g>
<g class="line-label" data-line="edges[4]">
<title>String worn out? → Turn the peg a little: no</title>
