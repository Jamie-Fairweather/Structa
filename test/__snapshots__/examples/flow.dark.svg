</g>
<g class="line" data-id="edges[0]" data-kind="flow" data-from="flat" data-to="tuner">
<title>String sounds flat → Clip on the tuner</title>
<path d="M161.67 76 L161.67 115" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M161.67 124 L157.17 115 L166.17 115 Z" fill="#6e7681"/>
</g>
<g class="line" data-id="edges[1]" data-kind="flow" data-from="tuner" data-to="pluck">
