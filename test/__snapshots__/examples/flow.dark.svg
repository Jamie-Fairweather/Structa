<path d="M108 560 L108 599" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M108 608 L103.5 599 L112.5 599 Z" fill="#6e7681"/>
</g>
<g class="line" data-id="edges[6]" data-kind="flow" data-from="peg" data-to="again">
