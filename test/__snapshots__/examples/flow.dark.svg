<svg xmlns="http://www.w3.org/2000/svg" width="459" height="1048" viewBox="0 0 459 1048">
<defs>
<pattern id="structa-grid-dark" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1" fill="#6e7681" fill-opacity="0.4"/></pattern>
<filter id="structa-shadow-dark" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#010409" flood-opacity="0.5"/></filter>
</defs>
<rect width="459" height="1048" fill="#0d1117"/>
<rect width="459" height="1048" fill="url(#structa-grid-dark)"/>
<g class="card" data-id="flat" data-kind="start">
<title>String sounds flat</title>
<rect class="outline" x="81.67" y="32" width="160" height="44" rx="22" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#structa-shadow-dark)"/>
<text x="161.67" y="59.09" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">String sounds flat</text>
</g>
<g class="card" data-id="tuner" data-kind="step">
<title>Clip on the tuner</title>
<rect class="outline" x="89.67" y="124" width="144" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#structa-shadow-dark)"/>
<text x="161.67" y="151.09" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Clip on the tuner</text>
</g>
<g class="card" data-id="pluck" data-kind="step">
<title>Pluck the string</title>
<rect class="outline" x="92.67" y="216" width="138" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#structa-shadow-dark)"/>
<text x="161.67" y="243.09" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Pluck the string</text>
</g>
<g class="card" data-id="worn" data-kind="decision">
<title>String worn out?</title>
<path class="outline" d="M138.67 308 L230.67 354 L138.67 400 L46.67 354 Z" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#structa-shadow-dark)" stroke-linejoin="round"/>
<text x="138.67" y="359.09" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">String worn out?</text>
</g>
<g class="card" data-id="restring" data-kind="subprocess">
<title>Fit a new string</title>
<rect class="outline" x="32" y="516" width="152" height="44" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#structa-shadow-dark)"/>
<path class="marks" d="M42 516 L42 560 M174 516 L174 560" fill="none" stroke="#30363d" stroke-width="1"/>
<text x="108" y="543.09" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Fit a new string</text>
</g>
<g class="card" data-id="peg" data-kind="step">
<title>Turn the peg a little</title>
<rect class="outline" x="224" y="516" width="163" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#structa-shadow-dark)"/>
<text x="305.5" y="543.09" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Turn the peg a little</text>
</g>
<g class="card" data-id="again" data-kind="step">
<title>Pluck it again</title>
<rect class="outline" x="67" y="608" width="123" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#structa-shadow-dark)"/>
<text x="128.5" y="635.09" font-family="Structa Inter, Inter, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Pluck it again</text>
</g>
<g class="card" data-id="tuned" data-kind="decision">
