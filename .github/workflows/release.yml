name: Release

# Pushing a version tag such as v1.0.0 runs every check, builds the skill
# folder and attaches it, as structa.zip, to that tag's GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The same typecheck, tests and gallery build as every pull request, on each supported Node.
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The oldest supported Node, which writes the shipped schema.
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - run: bun install --frozen-lockfile

      # Builds dist/structa, failing on any release-blocking check (ELK,
      # fonts, licences), then zips it into dist/structa.zip, labelled with
      # its licence, and writes dist/release-notes.md.
      - run: bun run release

      - name: Attach structa.zip to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/structa.zip --clobber
          else
            gh release create "$TAG" dist/structa.zip --verify-tag --title "Structa $TAG" \
              --notes-file dist/release-notes.md --generate-notes
          fi
