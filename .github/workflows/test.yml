name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Node, and the newest stable one. ("current"
        # can resolve to an alpha build, so use lts/* for the newest stable.)
        node: ["20", "lts/*"]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Vitest runs under this Node, the runtime Structa ships for.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - run: node --version

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run test

      # Builds the skill folder into dist/structa and runs the packaging checks,
      # then draws every example with it into the gallery page, so the gallery
      # script can't break unnoticed.
      - run: bun run gallery
